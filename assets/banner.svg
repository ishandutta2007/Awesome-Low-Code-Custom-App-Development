<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatRev {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.15); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 100; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pillGlow {
        0%, 100% { border-color: rgba(99, 102, 241, 0.3); }
        50% { border-color: rgba(56, 189, 248, 0.6); }
      }

      .bg-glow-1 {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: 250px 180px;
      }
      .bg-glow-2 {
        animation: pulseGlow 10s ease-in-out infinite 2s;
        transform-origin: 950px 220px;
      }
      .floating-card-1 {
        animation: floatSlow 7s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatRev 9s ease-in-out infinite 1s;
      }
      .animated-grid {
        stroke-dasharray: 6 6;
        animation: dashFlow 20s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" rx="16" />

  <!-- Animated Glowing Orbs (Strictly in Background) -->
  <g opacity="0.6">
    <circle class="bg-glow-1" cx="240" cy="160" r="220" fill="url(#glowPulse)" filter="url(#blurFilter)" />
    <circle class="bg-glow-2" cx="960" cy="240" r="240" fill="url(#cyanPulse)" filter="url(#blurFilter)" />
  </g>

  <!-- Geometric Tech Grid Patterns -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="1" class="animated-grid">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="360" x2="1200" y2="360" />
  </g>

  <!-- Subtle Ambient Circuit Nodes in Background -->
  <g opacity="0.25">
    <circle cx="100" cy="180" r="4" fill="#38bdf8" />
    <circle cx="300" cy="80" r="5" fill="#818cf8" />
    <circle cx="700" cy="360" r="4" fill="#c084fc" />
    <circle cx="900" cy="180" r="6" fill="#38bdf8" />
    <circle cx="1100" cy="280" r="5" fill="#818cf8" />
  </g>

  <!-- Floating UI Accent Cards (Flanking Sides, Never Obscuring Center Text) -->
  <g class="floating-card-1" opacity="0.85">
    <!-- Left Card: Low-Code Flow Builder -->
    <g transform="translate(60, 110)">
      <rect width="180" height="190" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" filter="url(#shadowFilter)" />
      <rect x="18" y="20" width="36" height="8" rx="4" fill="#38bdf8" opacity="0.8" />
      <rect x="18" y="42" width="144" height="28" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.3)" />
      <text x="32" y="60" fill="#bae6fd" font-family="sans-serif" font-size="11" font-weight="600">⚡ Visual Data Flow</text>
      <rect x="18" y="82" width="144" height="28" rx="6" fill="rgba(129, 140, 248, 0.15)" stroke="rgba(129, 140, 248, 0.3)" />
      <text x="32" y="100" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="600">🔌 Database / API</text>
      <rect x="18" y="122" width="144" height="28" rx="6" fill="rgba(192, 132, 252, 0.15)" stroke="rgba(192, 132, 252, 0.3)" />
      <text x="32" y="140" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="600">🚀 Production App</text>
      <circle cx="90" cy="74" r="3" fill="#38bdf8" />
      <circle cx="90" cy="114" r="3" fill="#818cf8" />
      <line x1="90" y1="70" x2="90" y2="82" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="90" y1="110" x2="90" y2="122" stroke="#818cf8" stroke-width="1.5" />
    </g>
  </g>

  <g class="floating-card-2" opacity="0.85">
    <!-- Right Card: Metric & Stack Summary -->
    <g transform="translate(960, 110)">
      <rect width="180" height="190" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" filter="url(#shadowFilter)" />
      <text x="22" y="36" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">ECOSYSTEM METRICS</text>
      <text x="22" y="70" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="800">450K+</text>
      <text x="22" y="88" fill="#64748b" font-family="sans-serif" font-size="11">Total GitHub Stars</text>
      
      <line x1="22" y1="104" x2="158" y2="104" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      
      <text x="22" y="132" fill="#a78bfa" font-family="sans-serif" font-size="20" font-weight="800">25+ Tools</text>
      <text x="22" y="150" fill="#64748b" font-family="sans-serif" font-size="11">SaaS &amp; Open-Source</text>
      <rect x="22" y="164" width="136" height="6" rx="3" fill="rgba(255,255,255,0.08)" />
      <rect x="22" y="164" width="98" height="6" rx="3" fill="url(#primaryGrad)" />
    </g>
  </g>

  <!-- Foreground Content Layer (Always Clear & Centered) -->
  <g transform="translate(600, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 68)">
      <rect x="-135" y="0" width="270" height="30" rx="15" fill="rgba(99, 102, 241, 0.18)" stroke="rgba(99, 102, 241, 0.45)" stroke-width="1" />
      <text x="0" y="20" text-anchor="middle" fill="#a5b4fc" class="pill-text">🚀 ENTERPRISE &amp; COMMUNITY PLATFORMS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="150" text-anchor="middle" fill="url(#primaryGrad)" class="title-text" font-size="44" filter="url(#shadowFilter)">
      Awesome Low-Code
    </text>
    <text x="0" y="202" text-anchor="middle" fill="#ffffff" class="title-text" font-size="40" filter="url(#shadowFilter)">
      Custom App Development
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="248" text-anchor="middle" fill="#94a3b8" class="sub-text" font-size="16">
      Curated guide to SaaS &amp; open-source platforms for building custom business applications &amp; internal tools
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(0, 300)">
      <!-- Pill 1 -->
      <g transform="translate(-270, 0)">
        <rect x="0" y="0" width="118" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" />
        <text x="59" y="22" text-anchor="middle" fill="#38bdf8" class="pill-text">⚡ Low-Code</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-140, 0)">
        <rect x="0" y="0" width="118" height="34" rx="17" fill="rgba(129, 140, 248, 0.12)" stroke="rgba(129, 140, 248, 0.35)" />
        <text x="59" y="22" text-anchor="middle" fill="#a5b4fc" class="pill-text">🛠️ Internal Tools</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(-10, 0)">
        <rect x="0" y="0" width="138" height="34" rx="17" fill="rgba(192, 132, 252, 0.12)" stroke="rgba(192, 132, 252, 0.35)" />
        <text x="69" y="22" text-anchor="middle" fill="#c084fc" class="pill-text">🌐 Self-Hosted OSS</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(140, 0)">
        <rect x="0" y="0" width="128" height="34" rx="17" fill="rgba(52, 211, 153, 0.12)" stroke="rgba(52, 211, 153, 0.35)" />
        <text x="64" y="22" text-anchor="middle" fill="#34d399" class="pill-text">📊 Enterprise SaaS</text>
      </g>
    </g>
  </g>

  <!-- Modern Inner Border Accent -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
</svg>
