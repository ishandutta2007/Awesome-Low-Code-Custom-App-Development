-out infinite}.floating-card-2{animation:floatRev 9s ease-in-out infinite 1s}.animated-grid{stroke-dasharray:6 6;animation:dashFlow 20s linear infinite}.pill-text,.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.sub-text{font-weight:400}.pill-text{font-weight:600;font-size:13px}</style></defs><rect width="100%" height="100%" fill="url(#bgGradient)" rx="16"/><g opacity=".6"><circle cx="240" cy="160" r="220" fill="url(#glowPulse)" class="bg-glow-1" filter="url(#blurFilter)"/><circle cx="960" cy="240" r="240" fill="url(#cyanPulse)" class="bg-glow-2" filter="url(#blurFilter)"/></g><g stroke="#60a5fa" stroke-width="1" class="animated-grid" opacity=".12"><line x1="100" x2="100" y1="0" y2="420"/><line x1="300" x2="300" y1="0" y2="420"/><line x1="500" x2="500" y1="0" y2="420"/><line x1="700" x2="700" y1="0" y2="420"/><line x1="900" x2="900" y1="0" y2="420"/><line x1="1100" x2="1100" y1="0" y2="420"/><line x1="0" x2="1200" y1="80" y2="80"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="280" y2="280"/><line x1="0" x2="1200" y1="360" y2="360"/></g><g opacity=".25"><circle cx="100" cy="180" r="4" fill="#38bdf8"/><circle cx="300" cy="80" r="5" fill="#818cf8"/><circle cx="700" cy="360" r="4" fill="#c084fc"/><circle cx="900" cy="180" r="6" fill="#38bdf8"/><circle cx="1100" cy="280" r="5" fill="#818cf8"/></g><g class="floating-card-1" opacity=".85"><g transform="translate(60, 110)"><rect width="180" height="190" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" filter="url(#shadowFilter)" rx="14"/><rect width="36" height="8" x="18" y="20" fill="#38bdf8" opacity=".8" rx="4"/><rect width="144" height="28" x="18" y="42" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.3)" rx="6"/><text x="32" y="60" fill="#bae6fd" font-family="sans-serif" font-size="11" font-weight="600">⚡ Visual Data Flow</text><rect width=